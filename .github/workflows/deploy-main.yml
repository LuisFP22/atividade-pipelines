name: Deploy Main

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy Main
        run: netlify deploy --prod --dir=. --site=${{ secrets.NETLIFY_SITE_ID_MAIN }} --auth=${{ secrets.NETLIFY_AUTH_TOKEN }}